syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package sync_pb;

// PhiSpecifics carries the opaque ciphertext for a Phi domain entity. Copied
// verbatim (all one field) from sync-service; the server is zero-knowledge with
// respect to this payload.
message PhiSpecifics {
  // AES-GCM ciphertext of a phi.PhiEntity, encrypted client-side under the Phi
  // domain key.
  optional bytes ciphertext = 1;
}
