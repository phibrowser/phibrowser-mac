// TRIMMED COPY of components/sync/protocol/sync_entity.proto from Chromium 150.0.7871.47, as
// vendored in sync-service (branch feature/m3-phi-sync). Only the fields the Phi
// sync engine sends or reads are kept; every kept field carries the EXACT number,
// type and label of the upstream definition, so these messages are wire
// compatible with the server's full messages (protobuf drops unknown fields on
// parse). See ../README.md for the field-by-field table.
