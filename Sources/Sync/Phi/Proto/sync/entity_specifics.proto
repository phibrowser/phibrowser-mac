syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package sync_pb;

import "encryption.proto";
import "phi_specifics.proto";

// Upstream EntitySpecifics also carries a `specifics_variant` oneof with ~70
// per-datatype fields (31729..1588764). None of them is kept: the Phi engine
// only ever writes `phi`, and any other variant arriving from the server is
// preserved as an unknown field. `phi` is deliberately NOT part of that oneof
// upstream either, so reading/writing it needs no oneof switch.
message EntitySpecifics {
  optional EncryptedData encrypted = 1;

  optional PhiSpecifics phi = 2000;
}
