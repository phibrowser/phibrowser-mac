//
// Payload schema for the opaque "phi" sync data type. A serialized PhiEntity is
// what gets sealed with AES-GCM under the Phi domain key and shipped as
// sync_pb.PhiSpecifics.ciphertext (EntitySpecifics field 2000). The server never
// sees this schema: it stores and forwards the ciphertext verbatim.
//
// Field-level last-writer-wins timestamps live inside this payload
// (PhiSettingValue.updated_at_ms), not on the sync entity.

syntax = "proto3";

package phi;

// The envelope for one phi entity. `kind` leaves room for future payload
// shapes without changing the sync data type.
message PhiEntity {
  oneof kind {
    PhiSettingEntity  setting  = 1;
    PhiSpaceEntity    space    = 2;   // M3-2
    PhiBookmarkEntity bookmark = 3;   // M3-3
    PhiPinTabEntity   pin_tab  = 4;   // M3-3
    PhiURLRuleEntity  url_rule = 5;   // M3-4a
    // M3-4b: PhiProfileEntity profile = 6;
  }
}

// A bag of synced settings, keyed by setting id (e.g. "theme.dark").
message PhiSettingEntity {
  map<string, PhiSettingValue> values = 1;
}

// One setting value plus the timestamp used for last-writer-wins merging.
message PhiSettingValue {
  // Milliseconds since the Unix epoch, taken on the device that wrote `v`.
  int64 updated_at_ms = 1;

  oneof v {
    bool bool_value = 2;
    string string_value = 3;
    int64 int_value = 4;
  }
}

// One Space. Entity identity is the client tag "phi-space:<space_uuid>";
// `space_uuid` is repeated inside the payload because client_tag_hash is a
// one-way SHA1 and the receiver cannot recover the uuid from it.
//
// Every mutable field is a PhiSettingValue -- M3-1's "value + LWW timestamp"
// message, reused verbatim so the shared LWW rule (larger updated_at_ms wins;
// equal timestamps -> lexicographically greater serialized bytes) applies
// field by field with no new merge code. The name PhiSettingValue is
// historical; it is the generic LWW-stamped scalar.
//
// Every field is ALWAYS emitted, never omitted-when-empty: an absent field
// cannot carry a timestamp, so "the user cleared it" and "an older client
// never knew about it" would be indistinguishable. Empty string / -1 are the
// explicit "cleared" encodings, documented per field.
message PhiSpaceEntity {
  // The ACCOUNT-LEVEL sync uuid for this Space (M3-2b / D6), resolved through
  // the device's `sync.spaceGlobalUuids` mapping table -- NOT the local
  // `SpaceModel.spaceId`, which never leaves the device and is never rewritten.
  // Stable across every rename, recolor, reorder and rebind; the literal
  // "default-space" for the account's single default Space (D1).
  string space_uuid = 1;

  // string_value. No uniqueness rule (matches the local model).
  PhiSettingValue name = 2;

  // string_value. Portable prefixed id: "phi:<catalog id>" or
  // "emoji:<codepoints>". Persisted verbatim even when the local catalog does
  // not know it -- IconPickerSelection.fromStorageValue returns nil and the UI
  // falls back at render time. Never normalized away on apply.
  PhiSettingValue icon_name = 3;

  // string_value, "#RRGGBB". Derived locally from the resolved theme, but
  // synced as an independent field: it is what the strip pill tints with, and
  // the receiver may not have the sender's theme. Applied verbatim.
  PhiSettingValue color_hex = 4;

  // string_value. Fractional index over the alphabet
  // "0-9A-Za-z" (ASCII-ascending, so byte order == rank order); never ends in
  // '0'. Account-wide strip order (D4). Ties break on space_uuid.
  PhiSettingValue rank = 5;

  // string_value: the account-global profile UUID from the M2 mapping
  // (AccountProfileSyncMappingStore "sync.profileGlobalUuids"), NEVER the
  // device-local Chromium basename. Not emitted, and ignored on arrival, for
  // space_uuid == "default-space" (D1). M1 §5: a rebind is exactly this one
  // field changing; no contained entity is rewritten on the wire.
  PhiSettingValue profile_uuid = 6;

  // string_value. Per-Space pinned theme id (AccountUserDefaults
  // "spaceThemeIds"). "" means "no pin, follow the global theme" -- the
  // explicit cleared encoding. Not emitted, and ignored on arrival, for
  // space_uuid == "default-space": that Space's theme IS the global theme,
  // already synced as the PhiCurrentThemeId setting in M3-1 (D1).
  PhiSettingValue theme_id = 7;

  // int_value: window-overlay alpha in milli-units (0...1000) for the light
  // appearance; -1 means "no custom opacity, use the resolved theme's own
  // alpha". Milli-integers rather than a new double case on PhiSettingValue:
  // it leaves the shipped M3-1 message untouched and is far below slider
  // resolution, so an applied value snapshots back identically (no echo).
  PhiSettingValue overlay_opacity_light = 8;

  // int_value, same encoding, dark appearance.
  PhiSettingValue overlay_opacity_dark = 9;

  // NOT last-writer-wins: merged with min(). Epoch ms of
  // SpaceModel.createdDate on the device that created the Space. Its only
  // consumer is determinism -- it is the last tiebreak in
  // LocalStore.getAllSpaces, so without it two devices can order rank-tied
  // Spaces differently.
  int64 created_at_ms = 10;

  reserved 11 to 14;  // M3-4 / M4. Do not reuse.
}

// One bookmark or bookmark folder. Entity identity is the client tag
// "phi-bookmark:<bookmark_uuid>"; `bookmark_uuid` is repeated inside the
// payload because client_tag_hash is a one-way SHA1 and the receiver cannot
// recover the uuid from it.
//
// Same conventions as PhiSpaceEntity: every MUTABLE field is a PhiSettingValue
// (M3-1's generic LWW-stamped scalar), always emitted, never omitted-when-empty
// -- an absent field cannot carry a timestamp, so "the user cleared it" and "an
// older client never knew it" would be indistinguishable. Immutable facts are
// plain fields and take no part in LWW.
//
// NO favicon bytes (D9): PhiSettingValue has no bytes case and adding one would
// touch the shipped M3-1 message. The receiver shows a placeholder and
// back-fills the icon itself (design §8).
message PhiBookmarkEntity {
  // Lowercase uuid, minted on the device that first published this row, then
  // stored verbatim in TabDataModel.syncId. NEVER the local `guid` (uppercase,
  // per-device, re-minted by every clone) -- see design §3.1.
  string bookmark_uuid = 1;

  // AUTHORITATIVE ONLY FOR A ROOT-LEVEL ITEM (`parent_uuid == ""`), where it is
  // one half of LOCATION and carries LOCATION's shared timestamp (design §4.3;
  // `parent_uuid` carries the same value, `rank` has its own).
  // For a DESCENDANT it is emitted for diagnostics and IGNORED
  // on receipt: the owning Space of a descendant is whatever its parent's Space
  // is, and a descendant's LOCATION is `parent_uuid` alone (`rank` still carries
  // its own timestamp). Excluded from the
  // change-detection signature for descendants, so a cross-Space folder move is
  // ONE entity change (the folder's own group) while `moveBookmarks` retags the
  // whole subtree locally with no baseline churn -- design §4.3 / R-M3-3-18.
  //
  // string_value: the ACCOUNT-LEVEL Space sync uuid (M3-2b / D6), resolved
  // through `sync.spaceGlobalUuids`; the literal "default-space" for the
  // account's default Space (D1). NEVER the local SpaceModel.spaceId.
  //
  // No profile_uuid field exists, by design (R-D6-14 item 1): the Profile is
  // DERIVED from the resolved local Space's `profileId`, because `bookmarkRoot`
  // is keyed on the PAIR (profileId, spaceId) and a second, independently
  // merged profile field would disagree with the Space's own binding after a
  // rebind, with no defined resolution.
  PhiSettingValue space_uuid = 2;

  // The other half of LOCATION (design §4.3): for a root-level item it shares
  // `space_uuid`'s timestamp; for a descendant it IS the location and carries
  // its own. Merged with LOCATION as a unit, never field by field.
  // string_value: the parent folder's `bookmark_uuid`,
  // or "" for "directly under this Space's bookmark root". The root itself is
  // NEVER an entity: it is a local structural artifact (one hidden folder per
  // (profileId, spaceId)) with no stable exported key, and the default Space's
  // root is physically shared with ProfileModel.bookmarkRoot (R-D6-14 item 5).
  PhiSettingValue parent_uuid = 3;

  // Ordering inside one LOCATION, with its OWN timestamp -- a pure reorder
  // restamps only this field, so it can no longer revert a concurrent move.
  // Merged by LWW, except that whichever side wins LOCATION also supplies the
  // rank (a rank is meaningless outside its location) -- design §4.3.
  // string_value: fractional index over "0-9A-Za-z" (ASCII-ascending, so byte
  // order == rank order); never ends in '0'. Ordering is PER PARENT -- two
  // ranks are only comparable inside one parent_uuid. Ties break on
  // bookmark_uuid.
  PhiSettingValue rank = 4;

  // INVARIANT, not LWW: a bookmark never becomes a folder or vice versa. A
  // remote entity whose is_folder disagrees with an existing local row is
  // refused, not applied (design §4.6).
  bool is_folder = 5;

  // string_value. Display title. A bookmark created with no title locally gets
  // its URL string as the title (LocalStore+Bookmark.swift:1362), so "" on the
  // wire means the peer really cleared it and is applied verbatim.
  PhiSettingValue title = 6;

  // string_value, absolute URL. For a folder this is the local placeholder
  // "https://bookmark.phi/folder" (LocalStore+Bookmark.swift:12-14), emitted so
  // the field is never absent; the receiver ignores it when is_folder is true.
  PhiSettingValue url = 7;

  // string_value. Split-view bookmark's right pane; "" = not a split bookmark
  // (the explicit cleared encoding). A Phi-native concept with no Chromium
  // analogue -- it goes on the wire as itself rather than being flattened into
  // two bookmarks the way the HTML exporter does.
  PhiSettingValue secondary_url = 8;

  // string_value. Display name of the right pane; "" = none.
  PhiSettingValue secondary_title = 9;

  // NOT last-writer-wins: written once by the creating device and merged
  // DETERMINISTICALLY on disagreement -- the non-zero side wins; if both are
  // non-zero and differ, the smaller wins. TabSource raw value
  // (0 phi / 1 chromium / 2 safari / 3 arc). approved §1 calls it "write once";
  // the merge rule covers only the two-device-disagreement case.
  int32 source = 10;

  // NOT last-writer-wins: merged with min(). Epoch ms of TabDataModel
  // .createdDate on the device that created the row. Its only consumer is
  // determinism: `bookmarksPublisher`'s fetch sorts by createdDate, so without
  // it two devices can order a rank-tied pair differently.
  int64 created_at_ms = 11;

  reserved 12 to 15;  // M3-4 / M4. Do not reuse.
}

// One pinned tab IN ONE OWNER. Entity identity is the client tag
// "phi-pin:<pin_uuid>:<ownerKey>" -- the PAIR (lineage, owner), not the lineage
// alone (design §3.2 / R-M3-3-15).
//
// Why the pair: `migratePinnedTabs` Profile->Space copies the profile's whole
// pin collection into EVERY Space of that profile, one new physical row per
// Space, all carrying the source's `pinLineageId`
// (LocalStore+PinnedTabScope.swift:474-493, :620-655) -- documented local
// behaviour ("Moving to a narrower scope copies each parent collection to its
// existing children", :83-87). One lineage in N Spaces is therefore N entities,
// not one entity with an arbitrary owner. Both devices derive the same entity
// set from the same rows, so a scope migration converges by identity.
message PhiPinTabEntity {
  // Lowercase-normalized copy of the local `pinLineageId`
  // (TabDataModelSchemaV9.swift:64-66). Not unique by itself -- see the header.
  string pin_uuid = 1;

  // Ownership, three-way, matching the ACCOUNT-LEVEL pinned-tab scope (D8).
  // IMMUTABLE for the life of the entity: it is half of the identity and is
  // part of the client tag, so it carries no timestamp and is never merged.
  // Moving a pin to another owner is a TOMBSTONE under the old tag plus a
  // CREATE under the new one, never a field change (design §7.2).
  //
  // An ABSENT oneof is the App scope -- the one place this schema does not
  // follow "always emitted", because here absence IS one of three exhaustive
  // values rather than "unknown". ownerKey in the client tag is the
  // `space_uuid`, the `profile_uuid`, or the literal "app".
  oneof owner {
    string space_uuid   = 2;  // Space scope: the account-level Space sync uuid
    string profile_uuid = 3;  // Profile scope: the account-global profile uuid
                              //                (sync.profileGlobalUuids)
  }

  // PLAIN last-writer-wins (there is no pin position group -- owner is identity,
  // not a mergeable field). string_value: fractional index over "0-9A-Za-z",
  // per owner. Ties break on pin_uuid.
  PhiSettingValue rank = 4;

  // string_value.
  PhiSettingValue title = 5;

  // string_value, absolute URL.
  PhiSettingValue url = 6;

  // string_value: the PARTNER's pin_uuid (its lineage id), or "" for a pinned
  // tab that is not half of a split. NEVER the partner's physical
  // `splitPartnerGuid`, which is per-device and per-copy. The partner is always
  // in the SAME owner, so the lineage alone identifies it.
  //
  // The two halves are two independent entities and may arrive in different
  // batches. The LANDING links them, not the live-window self-heal: a half whose
  // partner has not landed keeps `pendingPartnerLineage` on its cursor and its
  // snapshot re-emits the baseline's value, never "" (design §7.4).
  PhiSettingValue split_partner_uuid = 7;

  // NOT last-writer-wins: written once, merged deterministically on
  // disagreement -- same rule as PhiBookmarkEntity.source.
  int32 source = 8;

  // NOT last-writer-wins: merged with min().
  int64 created_at_ms = 9;

  reserved 10 to 13;  // M3-4 / M4. Do not reuse.
}

// One URL routing rule. Entity identity is the client tag
// "phi-urlrule:<rule_uuid>"; `rule_uuid` is repeated inside the payload
// because client_tag_hash is a one-way SHA1 and the receiver cannot recover
// the uuid from it.
//
// Same conventions as PhiSpaceEntity / PhiBookmarkEntity: every MUTABLE field
// is a PhiSettingValue (M3-1's generic LWW-stamped scalar), always emitted,
// never omitted-when-empty. Immutable facts are plain fields and take no part
// in LWW.
//
// THREE MERGE UNITS, three timestamps (design D15 as amended by R-M3-4a-40):
//   1. THE CONTENT GROUP: `host` + `path_prefix` + `ask`, one shared timestamp
//      carried by `host`. They are not merged field by field: `host` and
//      `path_prefix` are two halves of one match key, and a field-level merge of
//      "A changed the host" with "B changed the path" produces a rule neither
//      user ever wrote. `ask` rides with them because it only makes sense
//      against the key it qualifies.
//   2. THE TARGET: `target_space_uuid` with its OWN timestamp. It is NOT part of
//      the identity (D13) -- retargeting is a first-class edit and tombstone +
//      create would re-mint the identity every time -- but it is also not part
//      of the content group: it is this kind's LOCATION, it carries the
//      single-argument `locationStamp` the owned-item module reads for the A9
//      delete-vs-move arbitration, and keeping it separate lets a host edit on
//      one device and a retarget on another BOTH survive.
//   3. `rank`, its OWN timestamp: a pure reorder must not be able to revert a
//      concurrent retarget.
message PhiURLRuleEntity {
  // Lowercase uuid, minted on the device that first published this row, then
  // stored verbatim in SpaceURLRule.syncId. NEVER the local `id`, which is a
  // per-save handle (design §4.3).
  string rule_uuid = 1;

  // string_value. Match host in one of three forms: "github.com" (exact),
  // "*.figma.com" (suffix wildcard), "*git*" (contains). Normalized by the one
  // fixed-point function (design §8.1 / R-M3-4a-21), in exactly three steps:
  //   1. leading whitespace/newlines trimmed;
  //   2. the trailing run of {whitespace, newline, '.'} removed in ONE scan
  //      (NOT "strip dots then trim" -- that is not a fixed point: "a. ."
  //      would yield "a." and need another pass);
  //   3. lowercased (locale-independent).
  // No IDNA/punycode conversion (R-M3-4a-1).
  // CARRIES THE CONTENT GROUP'S TIMESTAMP.
  PhiSettingValue host = 2;

  // string_value. Percent-encoded canonical path prefix, or "" for "any path"
  // (the explicit cleared encoding). "/" means "root path only" and is a
  // DISTINCT value from "" -- see design §8.1. Normalized by the same
  // fixed-point function; a payload that is not a fixed point of it is
  // normalized in the kind's plan closure and republished (R-M3-4a-2 /
  // R-M3-4a-29).
  // Content-group member: its timestamp is written equal to `host`'s and
  // IGNORED on receipt.
  PhiSettingValue path_prefix = 3;

  // bool_value. true = a matching navigation prompts for a Space instead of
  // routing silently; `target_space_uuid` degrades to the prompt's default.
  // Content-group member, same timestamp rule as `path_prefix`.
  PhiSettingValue ask = 4;

  // string_value: the ACCOUNT-LEVEL Space sync uuid, resolved through
  // `sync.spaceGlobalUuids`; the literal "default-space" for the account's
  // default Space (D1); the literal "incognito-space" for the reserved
  // Incognito target (D12 / R-M3-4a-6). NEVER a local SpaceModel.spaceId and
  // NEVER a runtime "space.incognito.<uuid>".
  // ITS OWN timestamp (unit 2 above); this member is the LOCATION carrier.
  // An unresolvable value PARKS the entity; it is never rewritten (D16).
  PhiSettingValue target_space_uuid = 5;

  // Ordering among rules that tie on specificity, with its OWN timestamp.
  // string_value: fractional index over "0-9A-Za-z" (ASCII-ascending, so byte
  // order == rank order); never ends in '0'. Ordering is PER TARGET SPACE.
  // Ties break on rule_uuid. The receiver projects rank onto the dense local
  // `sortOrder` (design §8.3).
  PhiSettingValue rank = 6;

  // NOT last-writer-wins: merged with min(). Epoch ms of SpaceURLRule
  // .createdDate on the device that created the row.
  //
  // R-exec-16 / R-M3-4a-19: this field and `source` below CANNOT LAND on the
  // local row as-is, so the OUTBOUND PROJECTION must fold them against the
  // baseline before returning, or the two devices never converge (the raw-byte
  // publish compare re-differs every round). See BookmarkKind.swift:162-176.
  int64 created_at_ms = 7;

  // NOT last-writer-wins: written once by the FIRST publisher and merged
  // DETERMINISTICALLY on disagreement -- a non-zero baseline is copied
  // verbatim, never overwritten from the local row. There is no `source`
  // column on SpaceURLRule (V12 adds the six sync columns, none a source),
  // so EVERY publisher this build ships emits 0; the field exists so a later
  // build that does distinguish authoring surfaces has a stable slot, and the
  // baseline fold keeps such a value stable across devices meanwhile.
  // Diagnostics only; no matching behaviour depends on it.
  int32 source = 8;

  reserved 9 to 12;  // M3-4b / M4. Do not reuse.
}
